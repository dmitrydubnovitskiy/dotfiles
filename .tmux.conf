# ~/.tmux.conf

##### Основные настройки #####

# Префикс: Ctrl-a вместо Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Индексы окон и pane с нуля
set -g base-index 1
setw -g pane-base-index 1

# Окна не переименовываются автоматически
set -g allow-rename off
set -g automatic-rename off

# 256 цветов и true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Увеличенная история терминала
set -g history-limit 100000

# Быстрое обновление после запуска
set -s escape-time 0

# Мышь
set -g mouse on


##### Разделение панелей #####
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"


# Сохранять текущую директорию при создании панели или окна
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"


##### Навигация между панелями #####

# Vim-подобная навигация
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Навигация через Alt + стрелки без префикса
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R


##### Изменение размеров панелей #####

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### Окна #####

# Переход по окнам
bind -n M-h previous-window
bind -n M-l next-window

# Быстрое переименование окна
bind r command-prompt -I "#W" "rename-window '%%'"

# Закрытие панели и окна с подтверждением
bind x confirm-before -p "Закрыть панель? (y/n)" kill-pane
bind X confirm-before -p "Закрыть окно? (y/n)" kill-window


##### Копирование текста #####

# Режим копирования в стиле Vim
setw -g mode-keys vi

# Вход в copy-mode
bind [ copy-mode

# Копирование через v и y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Копирование в системный буфер обмена
# Для Linux нужен xclip или xsel
# Для macOS используется pbcopy
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"


##### Статусная строка #####

set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]| "

set -g window-status-format \
    "#[fg=#6c7086] #I:#W "
set -g window-status-current-format \
    "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

set -g status-right-length 80
set -g status-right \
    "#[fg=#a6e3a1] %Y-%m-%d #[fg=#f9e2af]%H:%M "

# Активная панель выделяется цветом
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"


##### Полезные команды #####

# Перезагрузить конфигурацию
bind r source-file ~/.tmux.conf \; display-message "Конфигурация перезагружена"

# Режим копирования в стиле Vim
setw -g mode-keys vi

# Войти в режим копирования
bind [ copy-mode

# Начать выделение
bind -T copy-mode-vi v send-keys -X begin-selection

# Скопировать выделение в системный буфер через xclip
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
    "xclip -selection clipboard -in"

# Отменить выделение
bind -T copy-mode-vi Escape send-keys -X cancel

# Вставка
bind C-v run-shell "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer"

